kind = "web"
previewPath = "/"
title = "4ETHR Team Portfolio"
description = "A frontend-only, futuristic portfolio for the 4ETHR hackathon team, with interactive team orbit visuals, project case studies, theme switching, and responsive storytelling."
version = "1.0.0"
id = "artifacts/4ethr"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20839

[services.development]
run = "pnpm --filter @workspace/4ethr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/4ethr", "run", "build" ]
serve = "static"
publicDir = "artifacts/4ethr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20839"
BASE_PATH = "/"
